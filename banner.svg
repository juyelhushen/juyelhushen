<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- scanline pattern -->
    <pattern id="scan" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="2" fill="rgba(0,255,65,0.018)"/>
      <rect x="0" y="2" width="1" height="2" fill="transparent"/>
    </pattern>
    <!-- grid pattern -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,255,65,0.055)" stroke-width="0.5"/>
    </pattern>
    <!-- glow filter for name -->
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- subtle glow for small text -->
    <filter id="glowsm" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- radial highlight -->
    <radialGradient id="rg1" cx="75%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#003a0a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- clip -->
    <clipPath id="clip"><rect width="900" height="280"/></clipPath>

    <!-- glitch animation -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Share+Tech+Mono&amp;display=swap');
      .name-text { font-family: 'Orbitron', 'Courier New', monospace; }
      .mono { font-family: 'Share Tech Mono', 'Courier New', monospace; }

      .glitch-layer1 {
        animation: glitch1 7s infinite;
      }
      .glitch-layer2 {
        animation: glitch2 7s infinite;
      }
      @keyframes glitch1 {
        0%,88%,100% { transform: translate(0,0); opacity: 0; clip-path: inset(0 0 100% 0); }
        89% { transform: translate(-4px, 0); opacity: 0.7; clip-path: inset(25% 0 55% 0); }
        90% { transform: translate(4px, 0); opacity: 0.5; clip-path: inset(65% 0 15% 0); }
        91% { transform: translate(0,0); opacity: 0; clip-path: inset(0 0 100% 0); }
        92% { transform: translate(-2px, 0); opacity: 0.4; clip-path: inset(40% 0 40% 0); }
        93% { transform: translate(0,0); opacity: 0; clip-path: inset(0 0 100% 0); }
      }
      @keyframes glitch2 {
        0%,88%,100% { transform: translate(0,0); opacity: 0; clip-path: inset(0 0 100% 0); }
        89% { transform: translate(3px, 0); opacity: 0.5; clip-path: inset(60% 0 20% 0); }
        90% { transform: translate(-3px, 0); opacity: 0.6; clip-path: inset(20% 0 60% 0); }
        91.5% { transform: translate(0,0); opacity: 0; clip-path: inset(0 0 100% 0); }
      }
      .cursor-blink {
        animation: blink 1s step-end infinite;
      }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      .status-pulse {
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,100%{opacity:1} 50%{opacity:0.2}
      }
    </style>
  </defs>

  <g clip-path="url(#clip)">

    <!-- BASE BLACK -->
    <rect width="900" height="280" fill="#000000"/>

    <!-- RADIAL GLOWS -->
    <rect width="900" height="280" fill="url(#rg1)"/>
    <rect width="900" height="280" fill="url(#rg2)"/>

    <!-- GRID -->
    <rect width="900" height="280" fill="url(#grid)"/>

    <!-- SCANLINES -->
    <rect width="900" height="280" fill="url(#scan)"/>

    <!-- TOP BORDER LINE -->
    <line x1="0" y1="0" x2="900" y2="0" stroke="#00ff41" stroke-width="1.5" opacity="0.9"/>

    <!-- BOTTOM BORDER LINE -->
    <line x1="0" y1="279" x2="900" y2="279" stroke="#00ff41" stroke-width="1.5" opacity="0.9"/>

    <!-- LEFT ACCENT LINE -->
    <line x1="0" y1="0" x2="0" y2="280" stroke="#00ff41" stroke-width="1.5" opacity="0.5"/>

    <!-- TOP-LEFT CORNER DETAIL -->
    <text x="14" y="18" class="mono" font-size="9" fill="#00ff4166" letter-spacing="3">◈ IDENTITY NODE // GITHUB PROFILE</text>
    <line x1="14" y1="22" x2="340" y2="22" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>

    <!-- TOP-RIGHT CORNER STATUS BOX -->
    <rect x="720" y="14" width="166" height="66" fill="none" stroke="#00ff4130" stroke-width="0.5"/>
    <rect x="720" y="14" width="166" height="66" fill="#00ff4106"/>

    <!-- Status dot -->
    <circle cx="733" cy="26" r="4" fill="#00ff41" class="status-pulse"/>
    <text x="743" y="30" class="mono" font-size="9" fill="#00ff41" letter-spacing="2">ONLINE</text>

    <text x="733" y="44" class="mono" font-size="9" fill="#00ff4166" letter-spacing="1">NODE:  juyelhushen</text>
    <text x="733" y="57" class="mono" font-size="9" fill="#00ff4166" letter-spacing="1">LOC:   India [IST]</text>
    <text x="733" y="70" class="mono" font-size="9" fill="#00ff4166" letter-spacing="1">SYS:   v3.0 STABLE</text>

    <!-- PROMPT PREFIX -->
    <text x="36" y="108" class="mono" font-size="16" fill="#39ff14" filter="url(#glowsm)" letter-spacing="2" opacity="0.9">&gt;_</text>

    <!-- MAIN NAME — base layer -->
    <text x="68" y="116"
      class="name-text"
      font-size="72"
      font-weight="900"
      fill="#ffffff"
      filter="url(#glow)"
      letter-spacing="3">JUYEL <tspan fill="#00ff41">HUSHEN</tspan></text>

    <!-- GLITCH LAYER 1 — cyan offset -->
    <text x="68" y="116"
      class="name-text glitch-layer1"
      font-size="72"
      font-weight="900"
      fill="#00ffff"
      opacity="0.7"
      letter-spacing="3">JUYEL <tspan fill="#00ffff">HUSHEN</tspan></text>

    <!-- GLITCH LAYER 2 — red offset -->
    <text x="68" y="116"
      class="name-text glitch-layer2"
      font-size="72"
      font-weight="900"
      fill="#ff0040"
      opacity="0.6"
      letter-spacing="3">JUYEL <tspan fill="#ff0040">HUSHEN</tspan></text>

    <!-- ROLE LINE -->
    <line x1="36" y1="138" x2="500" y2="138" stroke="#00ff41" stroke-width="0.5" opacity="0.4"/>
    <text x="36" y="160" class="mono" font-size="14" fill="#39ff14" letter-spacing="4" opacity="0.95"
      filter="url(#glowsm)">FULL-STACK ENGINEER  ·  AI EXPLORER  ·  BUILDER</text>
    <line x1="36" y1="168" x2="500" y2="168" stroke="#00ff41" stroke-width="0.5" opacity="0.4"/>

    <!-- STATUS TAGS ROW -->
    <!-- Tag 1 -->
    <rect x="36" y="186" width="110" height="20" fill="#003300" stroke="#00ff4155" stroke-width="0.5"/>
    <text x="91" y="200" class="mono" font-size="9" fill="#00ff41" text-anchor="middle" letter-spacing="1">Spring Boot</text>

    <rect x="152" y="186" width="94" height="20" fill="#003300" stroke="#00ff4155" stroke-width="0.5"/>
    <text x="199" y="200" class="mono" font-size="9" fill="#00ff41" text-anchor="middle" letter-spacing="1">React + TS</text>

    <rect x="252" y="186" width="72" height="20" fill="#003300" stroke="#00ff4155" stroke-width="0.5"/>
    <text x="288" y="200" class="mono" font-size="9" fill="#00ff41" text-anchor="middle" letter-spacing="1">AWS · Docker</text>

    <rect x="330" y="186" width="66" height="20" fill="#001a00" stroke="#00ff4133" stroke-width="0.5"/>
    <text x="363" y="200" class="mono" font-size="9" fill="#39ff1499" text-anchor="middle" letter-spacing="1">RAG · LLMs</text>

    <rect x="402" y="186" width="80" height="20" fill="#001a00" stroke="#00ff4133" stroke-width="0.5"/>
    <text x="442" y="200" class="mono" font-size="9" fill="#39ff1499" text-anchor="middle" letter-spacing="1">Agentic AI</text>

    <!-- BOTTOM META LINE -->
    <text x="36" y="240" class="mono" font-size="10" fill="#00ff4155" letter-spacing="2">[ BUILDING · BREAKING · FIXING · SHIPPING · REPEAT ]</text>

    <!-- BOTTOM TERMINAL PROMPT -->
    <text x="36" y="262" class="mono" font-size="11" fill="#39ff1488" letter-spacing="1">juyel@github:~$</text>
    <rect x="175" y="251" width="8" height="14" fill="#00ff41" class="cursor-blink"/>

    <!-- BOTTOM-RIGHT DECORATION -->
    <text x="866" y="262" class="mono" font-size="9" fill="#00ff4133" text-anchor="end" letter-spacing="2">◈◈◈</text>

    <!-- CORNER TRIANGLES - top left -->
    <polygon points="0,0 20,0 0,20" fill="#00ff41" opacity="0.7"/>
    <!-- bottom right -->
    <polygon points="900,280 880,280 900,260" fill="#00ff41" opacity="0.7"/>

  </g>
</svg>
